<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Marty and Miriam's live wedding photo upload gallery."
    />
    <title>Marty & Miriam | Wedding Photos</title>
    <link rel="preload" href="public/assets/wedding-background.png" as="image" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="upload-hero" id="upload" aria-labelledby="hero-title">
        <div class="hero-overlay"></div>
        <div class="upload-copy">
          <p class="kicker">Marty & Miriam</p>
          <h1 id="hero-title">Share your wedding photos</h1>
        </div>

        <form class="upload-panel" id="upload-form">
          <label>
            Your name
            <input id="guest-name" name="guestName" type="text" placeholder="Guest name" maxlength="80" />
          </label>
          <label>
            Short note
            <input id="photo-note" name="note" type="text" placeholder="Optional caption" maxlength="120" />
          </label>
          <label class="drop-zone" for="photo-files">
            <input id="photo-files" name="photos" type="file" accept="image/*" multiple />
            <span>Choose wedding photos</span>
            <small>JPG, PNG, HEIC, or phone camera uploads</small>
          </label>
          <p class="file-status" id="file-status">No photos selected yet.</p>
          <button class="button primary" type="submit">Upload to gallery</button>
          <p class="form-status" id="form-status" role="status"></p>
        </form>
      </section>

      <section class="gallery-section" id="gallery" aria-labelledby="gallery-title">
        <div class="section-heading">
          <p class="kicker">Live gallery</p>
          <h2 id="gallery-title">Photos from tonight</h2>
        </div>
        <div class="empty-state" id="empty-state">
          Photos will appear here as guests upload them.
        </div>
        <div class="gallery-grid" id="gallery-grid" aria-live="polite"></div>
      </section>
    </main>

    <template id="photo-template">
      <figure class="photo-card">
        <img alt="" loading="lazy" />
        <figcaption>
          <strong></strong>
          <span></span>
          <a download>Download</a>
        </figcaption>
      </figure>
    </template>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
